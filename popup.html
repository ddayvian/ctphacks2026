<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PhishGuard</title>
    <style>
      body {
        width: 280px;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .verdict {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .safe { color: #1a7f37; }
      .suspicious { color: #9a6700; }
      .dangerous { color: #cf222e; }
      .meta {
        font-size: 12px;
        color: #57606a;
        margin-bottom: 10px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
        font-size: 12px;
      }
      li {
        margin-bottom: 4px;
      }
      .empty {
        font-size: 12px;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <h1>PhishGuard</h1>
    <div id="content">
      <p class="empty">Open an email in Gmail to see its risk analysis.</p>
    </div>
    <script src="dist/popup.js"></script>
  </body>
</html>
